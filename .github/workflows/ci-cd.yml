name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  NODE_VERSION: '22'
  PYTHON_VERSION: '3.11'

jobs:
  # ==================== Backend ====================
  backend-tests:
    name: Backend Tests & Quality
    runs-on: ubuntu-latest

    env:
      TURSO_DATABASE_URL: ${{ secrets.TURSO_TEST_DB_URL || 'libsql://test.turso.io' }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_TEST_TOKEN || 'test-token' }}
      SECRET_KEY: ${{ secrets.TEST_SECRET_KEY || 'test-secret-key-for-ci-only-32-chars' }}
      ENVIRONMENT: testing

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'

    - name: Install backend dependencies
      run: |
        cd backend
        pip install -r requirements.txt
        pip install pytest pytest-cov pytest-asyncio bandit safety black isort flake8

    - name: Run linting
      run: |
        cd backend
        echo "=== Black formatting check ==="
        black --check app/ --diff || echo "WARNING: black formatting issues"
        echo "=== Import sorting ==="
        isort --check-only app/ || echo "WARNING: import sorting issues"
        echo "=== Flake8 ==="
        flake8 app/ --max-line-length=100 --ignore=E203,W503 --exit-zero

    - name: Run security checks
      run: |
        cd backend
        echo "=== Running Bandit security scan ==="
        bandit -r app/ -ll --exit-zero || echo "WARNING: bandit found issues"

    - name: Run tests
      run: |
        cd backend
        pytest tests/ -v --cov=app --cov-report=xml --cov-report=term-missing

    - name: Upload coverage
      uses: codecov/codecov-action@v4
      with:
        files: ./backend/coverage.xml
        flags: backend
        fail_ci_if_error: false

  # ==================== Frontend ====================
  frontend-tests:
    name: Frontend Tests & Build
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: 'frontend/package-lock.json'

    - name: Install dependencies
      run: |
        cd frontend
        npm ci --legacy-peer-deps

    - name: Run type checking
      run: |
        cd frontend
        npx tsc --noEmit || echo "WARNING: type-check issues"

    - name: Run linting
      run: |
        cd frontend
        npm run lint

    - name: Run tests
      run: |
        cd frontend
        npm test -- --coverage --watchAll=false || echo "WARNING: test failures"

    - name: Build
      env:
        NEXT_PUBLIC_API_URL: https://api.megilance.site/api
        NEXT_PUBLIC_BACKEND_URL: https://api.megilance.site
      run: |
        cd frontend
        npm run build

  # ==================== Security ====================
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'table'
        exit-code: '0'

  # ==================== Docker Build ====================
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    if: github.event_name == 'push'

    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build backend image
      uses: docker/build-push-action@v5
      with:
        context: ./backend
        push: false
        tags: megilance-backend:test
        cache-from: type=gha
        cache-to: type=gha,mode=max

  # ==================== Deploy (Staging) ====================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests, docker-build]
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    environment: staging

    steps:
    - uses: actions/checkout@v4

    - name: Deploy to DigitalOcean App Platform
      run: |
        echo "Deploying to staging environment..."
        # Add doctl or digitalocean CLI deployment here
