domains:
- domain: megilance.site
  type: PRIMARY
  zone: megilance.site
- domain: www.megilance.site
  type: ALIAS
  zone: megilance.site
- domain: api.megilance.site
  type: ALIAS
  zone: megilance.site
features:
- buildpack-stack=ubuntu-22
ingress:
  rules:
  - component:
      name: backend
      preserve_path_prefix: true
    match:
      path:
        prefix: /api
  - component:
      name: ai-service
      preserve_path_prefix: true
    match:
      path:
        prefix: /ai-api
  - component:
      name: frontend
    match:
      path:
        prefix: /
name: megilance
region: blr
services:
- dockerfile_path: backend/Dockerfile
  envs:
  - key: APP_NAME
    scope: RUN_AND_BUILD_TIME
    value: MegiLance API
  - key: ENVIRONMENT
    scope: RUN_AND_BUILD_TIME
    value: production
  - key: DEBUG
    scope: RUN_AND_BUILD_TIME
    value: "false"
  - key: LOG_LEVEL
    scope: RUN_AND_BUILD_TIME
    value: INFO
  - key: HOST
    scope: RUN_AND_BUILD_TIME
    value: 0.0.0.0
  - key: PORT
    scope: RUN_AND_BUILD_TIME
    value: "8000"
  - key: WORKERS
    scope: RUN_AND_BUILD_TIME
    value: "1"
  - key: TURSO_DATABASE_URL
    scope: RUN_AND_BUILD_TIME
    value: libsql://megilance-db-megilance.aws-ap-south-1.turso.io
  - key: TURSO_AUTH_TOKEN
    scope: RUN_TIME
    value: ${TURSO_AUTH_TOKEN}
  - key: SECRET_KEY
    scope: RUN_TIME
    value: ${SECRET_KEY}
  - key: JWT_SECRET_KEY
    scope: RUN_TIME
    value: ${JWT_SECRET_KEY}
  - key: JWT_ALGORITHM
    scope: RUN_AND_BUILD_TIME
    value: HS256
  - key: ACCESS_TOKEN_EXPIRE_MINUTES
    scope: RUN_AND_BUILD_TIME
    value: "30"
  - key: REFRESH_TOKEN_EXPIRE_DAYS
    scope: RUN_AND_BUILD_TIME
    value: "7"
  - key: REFRESH_TOKEN_EXPIRE_MINUTES
    scope: RUN_AND_BUILD_TIME
    value: "10080"
  - key: BACKEND_CORS_ORIGINS
    scope: RUN_AND_BUILD_TIME
    value: '["https://megilance.site","https://www.megilance.site","https://api.megilance.site"]'
  - key: ALLOWED_ORIGINS
    scope: RUN_AND_BUILD_TIME
    value: https://megilance.site,https://www.megilance.site
  - key: FRONTEND_URL
    scope: RUN_AND_BUILD_TIME
    value: https://megilance.site
  - key: UPLOAD_DIR
    scope: RUN_AND_BUILD_TIME
    value: ./uploads
  - key: MAX_UPLOAD_SIZE
    scope: RUN_AND_BUILD_TIME
    value: "10485760"
  - key: GOOGLE_CLIENT_ID
    scope: RUN_TIME
    value: ${GOOGLE_CLIENT_ID}
  - key: GOOGLE_CLIENT_SECRET
    scope: RUN_TIME
    value: ${GOOGLE_CLIENT_SECRET}
  - key: GITHUB_CLIENT_ID
    scope: RUN_TIME
    value: ${GITHUB_CLIENT_ID}
  - key: GITHUB_CLIENT_SECRET
    scope: RUN_TIME
    value: ${GITHUB_CLIENT_SECRET}
  - key: RESEND_API_KEY
    scope: RUN_TIME
    value: ${RESEND_API_KEY}
  - key: FROM_EMAIL
    scope: RUN_AND_BUILD_TIME
    value: onboarding@resend.dev
  - key: FROM_NAME
    scope: RUN_AND_BUILD_TIME
    value: MegiLance
  - key: SMTP_HOST
    scope: RUN_AND_BUILD_TIME
    value: smtp.gmail.com
  - key: SMTP_PORT
    scope: RUN_AND_BUILD_TIME
    value: "587"
  - key: STRIPE_PLATFORM_FEE_PERCENT
    scope: RUN_AND_BUILD_TIME
    value: "10.0"
  - key: MOCK_PAYMENTS_ENABLED
    scope: RUN_TIME
    value: "false"
  - key: CRYPTO_USE_TESTNET
    scope: RUN_TIME
    value: "false"
  - key: USDC_RECEIVING_ADDRESS_POLYGON
    scope: RUN_AND_BUILD_TIME
    value: 0x228d599d4c7e89194b94e9d65b1b4114870a4c34
  - key: DO_AI_API_KEY
    scope: RUN_AND_BUILD_TIME
    value: ${DO_AI_API_KEY}
  - key: DO_AI_API_BASE
    scope: RUN_AND_BUILD_TIME
    value: https://inference.do-ai.run/v1
  - key: DO_AI_MODEL
    scope: RUN_AND_BUILD_TIME
    value: llama3.3-70b-instruct
  github:
    branch: main
    deploy_on_push: true
    repo: ghulam-mujtaba5/MegiLance
  http_port: 8000
  instance_count: 1
  instance_size_slug: apps-s-1vcpu-2gb
  name: backend
- dockerfile_path: ai/Dockerfile
  github:
    branch: main
    deploy_on_push: true
    repo: ghulam-mujtaba5/MegiLance
  http_port: 8001
  instance_count: 1
  instance_size_slug: apps-s-1vcpu-1gb-fixed
  name: ai-service
- build_command: npm install --legacy-peer-deps --no-save autoprefixer@10.4.21 lightningcss-linux-x64-gnu@1.32.0
    @tailwindcss/oxide-linux-x64-gnu@4.2.4 && NEXT_TELEMETRY_DISABLED=1 TAILWIND_DISABLE_OPTIMISTIC=true
    TURBOPACK=0 ./node_modules/.bin/next build
  envs:
  - key: NODE_ENV
    scope: RUN_AND_BUILD_TIME
    value: production
  - key: NPM_CONFIG_PRODUCTION
    scope: RUN_AND_BUILD_TIME
    value: "false"
  - key: NEXT_PUBLIC_API_URL
    scope: RUN_AND_BUILD_TIME
    value: https://api.megilance.site/api
  - key: NEXT_PUBLIC_BACKEND_URL
    scope: RUN_AND_BUILD_TIME
    value: https://api.megilance.site
  - key: NEXT_PUBLIC_WS_URL
    scope: RUN_AND_BUILD_TIME
    value: wss://api.megilance.site
  - key: NEXT_PUBLIC_SHOW_DEMO_LOGIN
    scope: RUN_TIME
    value: "false"
  - key: NEXTAUTH_URL
    scope: RUN_AND_BUILD_TIME
    value: https://www.megilance.site
  - key: NEXT_PUBLIC_PREVIEW_MODE
    scope: RUN_AND_BUILD_TIME
    value: "false"
  - key: NEXT_PUBLIC_MOCK_PAYMENTS
    scope: RUN_AND_BUILD_TIME
    value: "false"
  github:
    branch: main
    deploy_on_push: true
    repo: ghulam-mujtaba5/MegiLance
  http_port: 3000
  instance_count: 1
  instance_size_slug: apps-s-1vcpu-1gb-fixed
  name: frontend
  run_command: node .next/standalone/server.js
  source_dir: frontend
