# MegiLance - Unified DigitalOcean App Platform Configuration
# This file combines frontend + backend in a single DigitalOcean App
name: megilance
region: nyc

services:
# ────────────────────────────────────────────────────────────────
# FRONTEND SERVICE - Next.js 16
# ────────────────────────────────────────────────────────────────
- name: web
  source_dir: frontend
  build_command: npm ci --legacy-peer-deps && npm run build
  run_command: PORT=3000 node .next/standalone/server.js
  github:
    repo: ghulam-mujtaba5/MegiLance
    branch: main
    deploy_on_push: true
  health_check:
    http_path: /
    initial_delay_seconds: 90
    period_seconds: 30
    timeout_seconds: 10
    success_threshold: 1
    failure_threshold: 5
  http_port: 3000
  instance_count: 1
  instance_size_slug: basic-xs
  routes:
    - path: /
  envs:
  - key: NODE_ENV
    value: "production"
    scope: RUN_TIME
  - key: NEXT_PUBLIC_BACKEND_URL
    value: "${API_SERVICE_HOST}"
    scope: RUN_AND_BUILD_TIME

# ────────────────────────────────────────────────────────────────
# BACKEND SERVICE - FastAPI + Uvicorn
# ────────────────────────────────────────────────────────────────
- name: api
  dockerfile_path: backend/Dockerfile
  source_dir: /
  github:
    repo: ghulam-mujtaba5/MegiLance
    branch: main
    deploy_on_push: true
  health_check:
    http_path: /api/health/live
    initial_delay_seconds: 60
    period_seconds: 30
    timeout_seconds: 10
    success_threshold: 1
    failure_threshold: 5
  http_port: 8000
  instance_count: 1
  instance_size_slug: basic-xs
  routes:
    - path: /api
  envs:
  # Database - Turso (REQUIRED: Set in DigitalOcean dashboard)
  - key: TURSO_DATABASE_URL
    scope: RUN_TIME
    type: SECRET
  - key: TURSO_AUTH_TOKEN
    scope: RUN_TIME
    type: SECRET
  # Security (REQUIRED: Set in DigitalOcean dashboard)
  - key: SECRET_KEY
    scope: RUN_TIME
    type: SECRET
  - key: JWT_SECRET_KEY
    scope: RUN_TIME
    type: SECRET
  # Configuration
  - key: ENVIRONMENT
    value: "production"
    scope: RUN_TIME
  - key: DEBUG
    value: "false"
    scope: RUN_TIME
  - key: LOG_LEVEL
    value: "INFO"
    scope: RUN_TIME
  # MongoDB Atlas - Required for blog articles (set in DO dashboard)
  - key: MONGODB_URI
    scope: RUN_TIME
    type: SECRET

# ────────────────────────────────────────────────────────────────
# DATABASE MIGRATIONS - Release Phase
# ────────────────────────────────────────────────────────────────
jobs:
- name: db-migrate
  source_dir: /
  dockerfile_path: backend/Dockerfile
  github:
    repo: ghulam-mujtaba5/MegiLance
    branch: main
  envs:
  - key: TURSO_DATABASE_URL
    scope: RUN_TIME
    type: SECRET
  - key: TURSO_AUTH_TOKEN
    scope: RUN_TIME
    type: SECRET
