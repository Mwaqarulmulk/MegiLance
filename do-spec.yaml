domains:
- domain: megilance.site
  type: PRIMARY
  zone: megilance.site
- domain: www.megilance.site
  type: ALIAS
  zone: megilance.site
- domain: api.megilance.site
  type: ALIAS
  zone: megilance.site
features:
- buildpack-stack=ubuntu-22
ingress:
  rules:
  - component:
      name: backend
      preserve_path_prefix: true
    match:
      path:
        prefix: /api/v1
  - component:
      name: backend
      preserve_path_prefix: false
    match:
      path:
        prefix: /health
  - component:
      name: ai-service
      preserve_path_prefix: true
    match:
      path:
        prefix: /ai-api
  - component:
      name: frontend
    match:
      path:
        prefix: /
name: megilance
region: blr
